[project]
name = "rocola"
version = "0.1.0"
description = "UI de la rocola (SDL2/pygame-ce) sobre MPD"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Bautista D. Fiori" }]
dependencies = [
    "pygame-ce>=2.4",   # en Debian bookworm: paquete python3-pygame
]

[project.scripts]
rocola = "rocola.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["rocola*"]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
# The app targets Debian bookworm's python3 but keeps 3.9-compatible syntax at runtime.
ignore = ["UP006", "UP007", "UP035", "UP045", "SIM105"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
