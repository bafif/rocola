<svg xmlns="http://www.w3.org/2000/svg" width="24" height="160" viewBox="0 0 24 160">
  <!-- Ámbar: a bubble tube at the side, amber liquid in glass with brass caps. The bubbles are drawn by the jukebox. Original artwork of the Rocola project (MIT). -->
  <defs>
    <linearGradient id="liquid" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7a3a10"/>
      <stop offset="0.35" stop-color="#e08a2a"/>
      <stop offset="0.55" stop-color="#ffc66a"/>
      <stop offset="1" stop-color="#8a4612"/>
    </linearGradient>
    <linearGradient id="brass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5e3a14"/>
      <stop offset="0.45" stop-color="#e9c27a"/>
      <stop offset="1" stop-color="#5e3a14"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff8e6" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#fff8e6" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#fff8e6" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="3" y="10" width="18" height="140" rx="6" fill="url(#liquid)"/>
  <rect x="7" y="14" width="4" height="132" rx="2" fill="url(#shine)"/>
  <rect x="3" y="10" width="18" height="140" rx="6" fill="none" stroke="#fff1d0" stroke-opacity="0.45" stroke-width="1"/>
  <rect x="1" y="0" width="22" height="12" rx="3" fill="url(#brass)"/>
  <rect x="1" y="148" width="22" height="12" rx="3" fill="url(#brass)"/>
</svg>
