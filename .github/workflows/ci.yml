# Lint and tests for the jukebox app and the shell scripts of the OS image. The app's
# tests also check the docs: every document in Spanish and English, no broken links.
# Building the ISO itself (make image) is heavy and stays a local/manual step.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest

  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: shellcheck
        run: |
          grep -rlE '^#!.*(ba)?sh' --exclude-dir=.git --exclude-dir=.venv . \
            | grep -v '\.md$' | sort | xargs shellcheck -S warning
      - name: music import script
        run: bash os/tests/music-import.sh
      - name: EDID reader
        run: bash os/tests/display-edid.sh
      - name: Display setup
        run: bash os/tests/display-setup.sh
