# Lint and tests for the jukebox app and the shell scripts of the OS image.
# Building the ISO itself (make image) is heavy and stays a local/manual step.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@e92bafb6253dcd438e0484186d7669ea7a8ca1cc # v6.4.3
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run pytest

  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: shellcheck
        run: |
          grep -rlE '^#!.*(ba)?sh' --exclude-dir=.git --exclude-dir=.venv . \
            | grep -v '\.md$' | sort | xargs shellcheck -S warning
