# Idioma de la rocola: es (español) o en (inglés). Lo escribe el menú de la app
# («Idioma / Language») cuando lo cambiás, y el instalador con el idioma que
# elegiste ahí. Vacío: manda el arranque (rocola.lang=en, la entrada «English» del
# pendrive) y, si no, el locale del sistema.
#
# Language of the jukebox: es (Spanish) or en (English). The app's menu
# ("Language / Idioma") writes it when you change it, and so does the installer with
# the language you picked there. Empty: the boot entry decides (rocola.lang=en, the
# "English" entry of the USB stick), and otherwise the system locale.
LANGUAGE=
