# Configuración de video de la rocola.
# La setea el instalador (o se edita a mano). Valores:
#   MODE = auto   -> config VGA segura; Xorg toma los modos por EDID si el monitor lo da
#   MODE = vga    -> fuerza modos VGA/moderno estándar (31 kHz+)
#   MODE = crt15  -> fuerza modelines de 15 kHz (CRT arcade/TV)
MODE=auto

# Estándar de TV para 15 kHz: ntsc (640x480i a 60 Hz) | pal (768x576i a 50 Hz).
# Elige la resolución de 15 kHz cuando PREFERRED_RES está vacío.
TV_STANDARD=ntsc

# Resolución preferida para 15 kHz (vacío = la del estándar de TV)
#   ej. CRT 15 kHz: 320x240_60, 640x480i_60, 384x288_50, 768x576i_50 (display/modelines)
PREFERRED_RES=
